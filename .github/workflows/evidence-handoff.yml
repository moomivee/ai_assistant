name: evidence-handoff
on:
  push:
    branches: [review/agent-eval-20261110]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qwen:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[handoff-probe]') || contains(github.event.head_commit.message, '[handoff-eval]') || contains(github.event.head_commit.message, '[handoff-suite]') || contains(github.event.head_commit.message, '[handoff-7b]')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      LLM_BASE_URL: http://127.0.0.1:11434/v1
      LLM_API_KEY: local
      LLM_MODEL: ${{ contains(github.event.head_commit.message, '[handoff-7b]') && 'qwen2.5:7b' || 'qwen2.5:3b' }}
      LLM_HTTP_TIMEOUT: '600'
      HTTP_TIMEOUT: '120'
      OLLAMA_CONTEXT_LENGTH: '8192'
      AGENT_MODE: loop
      AGENT_TIMEOUT_SECONDS: ${{ contains(github.event.head_commit.message, '[handoff-7b]') && '300' || '180' }}
      AGENT_ANSWER_RESERVE_SECONDS: ${{ contains(github.event.head_commit.message, '[handoff-7b]') && '120' || '60' }}
      ANSWER_SELF_REVIEW: 'false'
      PROMPT_SOURCE: local
      LANGFUSE_ENABLED: 'false'
      TRACE_CONTENT: 'true'
      TRACE_FILE: .cache/eval/handoff-traces.jsonl
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.5'
      - run: uv sync --locked
      - name: Start real Qwen on CPU
        run: |
          docker run -d --name ollama -p 127.0.0.1:11434:11434 -e OLLAMA_CONTEXT_LENGTH ollama/ollama:latest
          for attempt in $(seq 1 30); do
            if docker exec ollama ollama list; then break; fi
            sleep 2
          done
          docker exec ollama ollama pull "$LLM_MODEL"
          docker inspect ollama --format '{{.Image}}'
          docker exec ollama ollama list
      - run: uv run python -m src.cli prepare
      - name: Diagnose actual answer generation
        env:
          PROBE_ONLY: ${{ contains(github.event.head_commit.message, '[handoff-probe]') }}
          SUITE: ${{ contains(github.event.head_commit.message, '[handoff-suite]') }}
        run: |
          if [ "$SUITE" = true ]; then
            uv run python -m eval.handoff --suite --output .cache/eval/handoff-suite.json
          elif [ "$PROBE_ONLY" = true ]; then
            uv run python -m eval.handoff --probe-only --output .cache/eval/handoff.json
          else
            uv run python -m eval.handoff --output .cache/eval/handoff.json
          fi
      - name: Record runtime
        if: always()
        run: |
          docker exec ollama ollama ps || true
          docker logs --tail 30 ollama || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-handoff
          path: .cache/eval/
      - if: always()
        run: docker rm -f ollama || true
